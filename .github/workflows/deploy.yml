# בונה את ה-image של Strapi ודוחף אותו ל-GHCR (package ציבורי) בכל דחיפה ל-main.
#
# למה כאן ולא על ה-VPS: קודם auto-deploy.sh הריץ `docker compose build` על השרת עצמו —
# 14 דקות של npm ci + strapi build, על שתי הליבות שמשרתות את כל האתרים החיים. בזמן
# הבנייה העומס טיפס ל-2.8, שאילתת SELECT 1 הגיעה ל-545ms ולוח הבקרה הכריז "עומס
# קריטי". בין בנייה לבנייה השרת ישב בטלה (עומס 0.05). הבנייה עברה לכאן.
#
# ה-VPS לא צריך SSH נכנס — חומת האש חוסמת את טווחי ה-runners של GitHub, וזו הסיבה
# שה-CI הקודם ננטש. הוא ממשיך למשוך לבד ב-cron, רק שעכשיו הוא מושך image מוכן
# במקום לבנות אותו. ראה deploy/auto-deploy.sh.
name: Build & publish image (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

# דחיפות רצופות ל-main: אין טעם לסיים build שכבר עבר עליו קומיט חדש
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ה-SHA הוא התג המחייב: auto-deploy.sh מושך לפי הקומיט המדויק, כדי שלא ייווצר
          # מצב שהקוד על השרת מקומיט אחד וה-image מקומיט אחר. latest הוא לנוחות בלבד
          # (משיכה ידנית) — הדפלוי אף פעם לא פורס לפיו.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # cache בין ריצות — הבנייה הראשונה מלאה, הבאות מהירות בהרבה
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # בלי attestation manifests — הם מסבכים את docker manifest inspect בשרת
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Image published 🚀"
            echo '```'
            echo "${{ env.IMAGE }}:${{ github.sha }}"
            echo '```'
            echo "ה-VPS ימשוך אותו בטיק ה-cron הבא (עד 5 דקות)."
          } >> "$GITHUB_STEP_SUMMARY"
